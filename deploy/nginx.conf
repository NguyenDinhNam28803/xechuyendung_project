# /etc/nginx/sites-available/xechuyendung
# Thay ten-mien.vn bằng tên miền thật (2 chỗ server_name + đường dẫn chứng chỉ do certbot tạo).
#
# Luồng: Internet → Nginx :443 → Next.js 127.0.0.1:3000 → NestJS 127.0.0.1:4000 → PostgreSQL.
# NestJS KHÔNG được mở ra Internet: trình duyệt chỉ nói chuyện với Next.

upstream xe_next {
  server 127.0.0.1:3000;
  keepalive 32;
}

# HTTP → HTTPS (certbot cũng thêm khối tương tự; giữ một khối thôi)
server {
  listen 80;
  listen [::]:80;
  server_name ten-mien.vn www.ten-mien.vn;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://ten-mien.vn$request_uri; }
}

# www → tên miền chính
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.ten-mien.vn;
  ssl_certificate     /etc/letsencrypt/live/ten-mien.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ten-mien.vn/privkey.pem;
  return 301 https://ten-mien.vn$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ten-mien.vn;

  ssl_certificate     /etc/letsencrypt/live/ten-mien.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ten-mien.vn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Form liên hệ giới hạn 8 KB ở Next; 1 MB là đủ cho trang quản trị.
  client_max_body_size 1m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # File build có hash trong tên: cache 1 năm.
  location /_next/static/ {
    proxy_pass http://xe_next;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://xe_next;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # BẮT BUỘC: GHI ĐÈ (không nối thêm) IP thật của khách. Next chuyển IP này sang API để giới hạn
    # tần suất form liên hệ / đăng nhập theo từng người (app/lib/admin-backend.ts).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }
}
